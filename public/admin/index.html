<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>ビカクシダ管理 CMS</title>
    <style>
      @media (max-width: 768px) {
        /* サイドバーを非表示にして全幅表示 */
        [class*="SidebarContainer"],
        [class*="CollectionTopContainer"],
        [class*="NavContainer"] {
          display: none !important;
        }
        /* コンテンツエリアを全幅に */
        [class*="MainContainer"],
        [class*="App-container"],
        [class*="MainAreaContainer"] {
          width: 100% !important;
          margin-left: 0 !important;
          padding-left: 0 !important;
        }
              /* 画像モーダルを全幅に */
        [class*="ModalContainer"],
        [class*="Dialog"],
        [class*="MediaLibrary"] {
          width: 100vw !important;
          max-width: 100vw !important;
          left: 0 !important;
          right: 0 !important;
          margin: 0 !important;
          border-radius: 0 !important;
        }

        /* モーダル上部のボタン行を縦並びに */
        [class*="MediaLibraryTop"],
        [class*="LibraryTop"] {
          flex-wrap: wrap !important;
          gap: 8px !important;
        }

        /* ボタンを押しやすく */
        [class*="MediaLibrary"] button {
          min-height: 44px !important;
          font-size: 14px !important;
        }
        /* モーダル全体を画面内に収める */
        [class*="MediaLibrary"],
        [class*="Modal"] {
          position: fixed !important;
          top: 0 !important;
          left: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
          height: 100% !important;
          overflow-y: auto !important;
          box-sizing: border-box !important;
        }

        /* ボタン行をスクロール可能に */
        [class*="MediaLibraryTop"],
        [class*="LibraryTop"],
        [class*="ToolbarContainer"] {
          display: flex !important;
          flex-wrap: wrap !important;
          overflow-x: auto !important;
          gap: 8px !important;
          padding: 8px !important;
        }
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.registerPreviewStyle(`
        img { max-width: 100%; max-height: 280px; object-fit: cover; display: block; }
        body { font-family: sans-serif; padding: 20px; font-size: 14px; }
        h1 { font-size: 22px; margin: 8px 0 4px; }
        p { margin: 4px 0; color: #555; }
      `);

      CMS.registerPreviewTemplate('plants', ({ entry }) => {
        const data = entry.getIn(['data']).toJS();
        return h('div', { style: { maxWidth: '600px', padding: '16px' } },
          data.cover_image && h('img', {
            src: data.cover_image,
            style: { width: '100%', maxHeight: '280px', objectFit: 'cover', marginBottom: '16px' }
          }),
          h('p', { style: { fontSize: '11px', color: '#4a7a3a' } }, data.status),
          h('h1', {}, data.title),
          h('p', { style: { fontStyle: 'italic', color: '#888' } }, data.species),
          h('p', {}, '📅 ' + (data.acquired_date || '—')),
          h('p', {}, '📍 ' + (data.location || '—')),
          h('p', {}, '🪵 ' + (data.mount || '—')),
          data.description && h('p', { style: { marginTop: '12px', lineHeight: '1.8' } }, data.description)
        );
      });
    </script>
  </body>
</html>
